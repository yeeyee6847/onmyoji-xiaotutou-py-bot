<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{ csrf }}">
<title>結緣帖 · 碎片工作台</title><link rel="stylesheet" href="/static/account.css"><link rel="stylesheet" href="/static/workspace.css"><script src="/static/picker.js" defer></script><script src="/static/workspace.js" defer></script></head>
<body data-mode="{{ mode }}"><main class="workspace"><a class="brand" href="/shards">結緣帖<span>碎片工作台</span></a>
<nav><a href="/shards">圖片匯入／圖鑑</a><a href="/my-fragments">我的碎片／人工匯入</a><a href="/search-fragments">搜索碎片</a><a href="/game-accounts">遊戲帳號</a><a id="admin-nav" href="/admin/samples" hidden>头像參考審核</a><a href="/account">我的帳號</a><a href="/trades">交換申請／交換中</a></nav>
<h1 id="workspace-title"></h1><p id="workspace-message" class="notice" role="status" hidden></p>
<section id="fragment-controls" hidden><div class="tools"><label id="account-control">遊戲帳號<select id="workspace-account"><option value="">全部帳號</option></select></label><label>式神<select id="workspace-shikigami"><option value="">全部式神</option></select></label><label>Rarity<select id="workspace-rarity"><option value="">全部</option><option>SSR</option><option>SP</option><option>UR</option><option value="COLLAB">聯動</option></select></label><label>清單<select id="workspace-target"><option value="">全部</option><option value="offers">可提供</option><option value="wants">想要</option></select></label><label id="server-control">伺服器<input id="workspace-server" maxlength="80" placeholder="伺服器名稱"></label><button id="workspace-search">查詢</button></div><p class="minor">最多顯示 1000 筆；可用式神、分類及伺服器縮小範圍。</p></section>
<section id="manual-section" hidden><h2>人工匯入碎片</h2><p>先選擇遊戲帳號，再加入式神及數量。儲存會覆蓋該帳號、式神、分類的現有數量；填 0 清空，不會累加。</p><details id="manual-account-create"><summary>＋ 新增遊戲帳號</summary><form id="manual-account-form" class="tools">
<label>遊戲帳號名字<input name="nickname" maxlength="80" required></label>
<label>伺服器<input name="server_name" maxlength="80" value="亞洲"></label>
<button type="submit">新增並選取帳號</button></form><p id="manual-account-message" role="status" hidden></p></details>
<p id="manual-account-selected" class="notice">請先在上方選擇要匯入的遊戲帳號。</p><div id="manual-rows"></div><div class="tools"><button id="manual-add" class="secondary">＋ 加一項</button><button id="manual-save">保存人工清單</button></div></section>
<section id="fragment-results" hidden><div class="table-scroll"><table><thead><tr><th>式神</th><th>分類</th><th>數量</th><th>玩家</th><th>遊戲帳號／伺服器</th><th id="action-head">操作</th></tr></thead><tbody id="workspace-rows"></tbody></table></div><p id="workspace-empty" hidden>沒有符合的碎片記錄。</p></section>
<section id="samples-section" hidden><p>左圖為原始卡片裁切，右圖為排除數字、名字與邊框的比對區域。只有審核通過的參考圖才會用於下次識別；請確認皮膚與式神配對。</p><div class="tools"><label>樣本狀態<select id="sample-status"><option value="pending">待審核</option><option value="approved">已啟用</option><option value="rejected">已停用</option><option value="all">全部</option></select></label><button id="samples-refresh">重新整理</button><button id="samples-prev" class="secondary">上一頁</button><span id="samples-page"></span><button id="samples-next" class="secondary">下一頁</button></div><div id="sample-grid" class="sample-grid"></div></section>
</main></body></html>
