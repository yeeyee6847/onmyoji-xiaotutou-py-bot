services:
  - type: web
    name: lucky-house
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-ocr.txt && python prepare_ocr.py
    startCommand: python run_all.py
    healthCheckPath: /healthz
    numInstances: 1
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_TRADE_MODE
        value: dm
      - key: DISCORD_TRADE_CHANNEL_ID
        value: "1504352387635216545"
